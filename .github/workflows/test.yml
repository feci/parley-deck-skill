name: Tests

# The release workflow already runs `npm test`, but only once a release is published — far
# too late for the Python leg to be useful. This runs the whole suite on every push and pull
# request instead.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the parley-bidding manifest declares, and a current interpreter. The
        # floor catches a claim the add-on cannot keep; the current one catches deprecations.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: npm ci
      - run: npm test
      # Packaging preflight: prepack re-checks every shipped add-on payload against the
      # manifest committed beside it, so a payload edit that forgot to regenerate fails here
      # rather than in a published tarball.
      - run: npm pack --dry-run
